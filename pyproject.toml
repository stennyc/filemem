# T5a: entry-point package for the filemem provider (方案 A, @user decision 2026-09-27).
#
# Layout invariant (drift-proofing, learned in T3): the WHEEL ships the SAME source
# tree as the directory install (repo root == the plugin's __init__.py), mapped to the
# underscore module name `filemem`. There is no second copy anywhere, so the pip
# install and the user-directory install can never drift apart.
#
# Engine contract (verified against hermes source, plugins/memory/__init__.py +
# plugins_discovery.py):
#   * entry-point group  = "hermes_agent.memory_providers" (ENTRY_POINTS_GROUP, L30)
#   * EP NAME must equal the provider name "filemem" (activation is by name)
#   * EP VALUE points at a module exposing register(ctx) — the engine's
#     _load_provider_from_entry_point handles "module with register" first-class,
#     and _ProviderCollector routes hooks/tools through the real PluginContext
#   * load order: bundled > user dir > project > pip entry point; same-name directory
#     wins and dedupes via `seen`, so dir + pip coexisting never double-registers
#
# No runtime dependencies: the provider is stdlib-only; `agent.memory_provider`
# (the MemoryProvider base) is provided by the running hermes-agent tree at import
# time. Installing this wheel must not mutate the hermes-agent install (upgrade-safe:
# hermes-agent upgrades only touch their own dist-info, re-run install.sh to re-verify).

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-filemem"
version = "1.0.0"
description = "File-based memory provider for Hermes Agent (directory install or pip entry point)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Agnes" }]
dependencies = []

# The provider entry point. module, no attribute: entry_point.load() returns the
# filemem module, which the engine resolves via its module-with-register path.
[project.entry-points."hermes_agent.memory_providers"]
filemem = "filemem"

[tool.setuptools]
# Explicit (non-discovered) package list + mapping: repo root -> filemem,
# consolidation/ -> filemem.consolidation. Only top-level *.py files of the
# mapped root ship (that is exactly __init__.py + config_schema.py); subdirs such
# as tests/ tools/ extractor/ are NOT mapped and therefore excluded from the wheel.
packages = ["filemem", "filemem.consolidation"]

# Dotted package names must be QUOTED keys, otherwise TOML parses
# `filemem.consolidation` as a sub-table of `filemem` (which is a string
# value here) and raises "Cannot overwrite a value".
[tool.setuptools.package-dir]
filemem = "."
"filemem.consolidation" = "consolidation"

# Disk-side companions the engine reads from the entry point's package dir
# (find_provider_dir docstring: config_schema.py / cli.py are read from disk, not
# imported — a pip-installed provider without them silently loses its dashboard
# panel and CLI commands). Explicit lists; the top-level *.md report files and
# install.sh are deliberately NOT bundled.
[tool.setuptools.package-data]
filemem = ["config_schema.py", "decay.json", "plugin.yaml", "README.md"]
