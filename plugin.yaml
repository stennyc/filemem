name: filemem
version: 1.0.0
description: File-based memory provider with semantic search and Demo integration
author: stennyc
license: AGPL-3.0-or-later
python_dependencies:
  - "psycopg2-binary"
  - "PyYAML>=6.0"
hooks:
  pre_llm_call: true
  post_llm_call: true
provides_tools:
- filemem_read
- filemem_write
- filemem_search
- filemem_delete
- filemem_review_drafts
- filemem_check_promotion
- shared_memory_search
- shared_memory_handoff
- shared_memory_take
# 补列：__init__.py 已实现但 plugin.yaml 漏声明的 6 个（对齐宿主工具面注册）
- filemem_supersede
- filemem_plan
- gate5_worldview_upsert
- filemem_set_bringback
- filemem_handoff_extract
- filemem_scheduled
config_schema:
  auto_extract:
    type: bool
    default: true
    label: Auto extract
    description: 从对话自动沉淀记忆条目。
  min_search_score:
    type: float
    default: 0.3
    label: Min search score
    description: 检索相关度门控（0-1），低于此分数不注入。
