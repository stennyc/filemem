name: filemem
version: 1.0.0
description: File-based memory provider with semantic search and Demo integration
author: stennyc
license: AGPL-3.0-or-later
python_dependencies:
  - "psycopg2-binary"
  - "PyYAML>=6.0"
hooks:
  pre_llm_call: true
  post_llm_call: true
provides_tools:
- filemem_read
- filemem_write
- filemem_search
- filemem_delete
- filemem_review_drafts
- filemem_check_promotion
- shared_memory_search
- shared_memory_handoff
- shared_memory_take
# 补列：__init__.py 已实现但 plugin.yaml 漏声明的 6 个（对齐宿主工具面注册）
- filemem_supersede
- filemem_plan
- gate5_worldview_upsert
- filemem_set_bringback
- filemem_handoff_extract
- filemem_scheduled

# 2026-11-17: plugin-side config schema manifest — the central shared-memory
# (PostgreSQL) connection, kbs-mirrored (filemem + kbs share one central
# sharedmem store, so the template defaults match). The dashboard
# plugin-settings panel writes these sm_* scalars to
# plugins.entries.filemem.settings; shared_memory.py::_load_shared_memory_config
# reads that panel layer first, then falls back to the nested .shared_memory
# section (three-layer read, kbs parity).
config_schema:
  sm_enabled:
    type: bool
    default: true
    label: "Shared memory enabled"
    description: "中央 shared-memory 面开关。"
  sm_agent_id:
    type: str
    default: "local"
    label: "Agent ID"
    description: "机器级 agent 标识（跨机 50 台 = 50 个 agent_id）。"
  sm_token:
    type: str
    default: "local-67a09bdf6d0c68e8-s4"
    label: "Auth token"
    description: "中央 PG 认证 token。"
  sm_pg_host:
    type: str
    default: "127.0.0.1"
    label: "PG host"
  sm_pg_port:
    type: int
    default: 5432
    label: "PG port"
  sm_pg_db:
    type: str
    default: "sharedmem"
    label: "PG database"
  sm_pg_user:
    type: str
    default: "sharedmem"
    label: "PG user"
  sm_pg_password:
    type: str
    default: "c44dafef06869c6f96ad3f9432cf3eb0"
    label: "PG password"
  sm_pg_sslmode:
    type: str
    default: "prefer"
    label: "PG sslmode"
    description: "libpq sslmode (2026-11-18 F4 TLS): prefer/require/verify-ca/verify-full. 默认 prefer = 旧行为不变; 活配置设 require 走 TLS。"
